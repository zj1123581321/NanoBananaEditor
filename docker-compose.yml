# Nano Banana AI Image Editor - Docker Compose 配置
# 支持单用户和多用户模式的灵活部署

version: '3.8'

services:
  # 前端应用
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_APP_MODE=${VITE_APP_MODE:-standalone}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - all
      - standalone
      - multi-user

  # 后端服务 (图片服务器 + API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${IMAGE_SERVER_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - IMAGE_SERVER_PORT=${IMAGE_SERVER_PORT:-3002}
      - IMAGE_SERVER_HOST=0.0.0.0
      - CORS_ORIGIN=http://frontend
    env_file:
      - .env
    volumes:
      - generated_images:/app/generated_images
      - app_logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - all
      - standalone
      - multi-user

  # 管理后台 (仅多用户模式)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "${ADMIN_PORT:-3003}:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_BACKEND_URL=http://backend:3002
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - multi-user

  # Nginx 反向代理 (生产环境可选)
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

networks:
  app-network:
    driver: bridge
    name: nano-banana-network

volumes:
  generated_images:
    name: nano-banana-images
  app_logs:
    name: nano-banana-logs

# ============================================
# 部署命令示例:
# 
# 单用户模式:
#   docker-compose --profile standalone up -d
# 
# 多用户模式:
#   docker-compose --profile multi-user up -d
# 
# 生产环境 (带 Nginx):
#   docker-compose --profile production up -d
#
# 完整部署:
#   docker-compose --profile all up -d
# ============================================
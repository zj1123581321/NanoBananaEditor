# Nano Banana AI Image Editor - Docker Compose 配置
# 统一架构：单一后端+多前端路由



services:
  # 统一服务 (后端API + 前端静态文件 + 管理后台)
  ai_image_editor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full.unified
      args:
        # 仅固定应用模式为多用户；其他变量从 .env 读取
        VITE_APP_MODE: ${VITE_APP_MODE:-multi-user}
    ports:
      - "${APP_PORT:-3002}:3002"
    env_file:
      - ../.env
    environment:
      # 强制运行时也为多用户
      VITE_APP_MODE: multi-user
    volumes:
      - generated_images:/app/generated_images
      - app_logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # 默认启用 multi-user 模式（无需指定 profile）

  # Nginx 反向代理 (生产环境可选，用于SSL终端和负载均衡)
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai_image_editor
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - production

networks:
  app-network:
    driver: bridge
    name: nano-banana-network

volumes:
  generated_images:
    name: nano-banana-images
  app_logs:
    name: nano-banana-logs

# ============================================
# 统一架构部署命令示例:
# 
# 默认多用户模式:
#   docker-compose up -d
# 
# 单用户模式:
#   VITE_APP_MODE=standalone docker-compose up -d
# 
# 生产环境 (带 Nginx SSL):
#   docker-compose --profile production up -d
#
# ============================================
# 
# 🚀 统一架构优势:
# - 仅占用1个端口 (默认3002)
# - 单容器部署，资源消耗更低
# - 简化的网络配置
# - 主前端: http://localhost:3002/
# - 管理后台: http://localhost:3002/admin/
# - API: http://localhost:3002/api/
# 
# ============================================

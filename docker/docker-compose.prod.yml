# ============================================
# Nano Banana AI Image Editor - 生产环境配置
#
# 使用方式：
#   cd docker
#   docker-compose -f docker-compose.prod.yml up -d
#
# 说明：
#   - 使用预构建的镜像，不需要本地 build
#   - 需要先导入镜像：docker load < nano-banana-editor-xxx.tar
#   - 需要配置 .env.prod 文件
# ============================================

services:
  ai_image_editor:
    image: nano-banana-editor:latest
    container_name: nano-banana-prod
    ports:
      - "${APP_PORT:-3002}:3002"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      VITE_APP_MODE: ${VITE_APP_MODE:-multi-user}
    volumes:
      - generated_images:/app/generated_images
      - app_logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx 反向代理（可选，用于 SSL 和负载均衡）
  nginx:
    image: nginx:alpine
    container_name: nano-banana-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ai_image_editor
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - with-nginx

networks:
  app-network:
    driver: bridge
    name: nano-banana-prod-network

volumes:
  generated_images:
    name: nano-banana-prod-images
  app_logs:
    name: nano-banana-prod-logs

# ============================================
# 部署步骤：
#
# 1. 导入镜像：
#    docker load < nano-banana-editor-YYYYMMDD-HHMMSS.tar
#
# 2. 配置环境变量：
#    cp .env.prod.example .env.prod
#    vim .env.prod  # 编辑实际配置
#
# 3. 启动服务：
#    docker-compose -f docker-compose.prod.yml up -d
#
# 4. 带 Nginx（可选）：
#    docker-compose -f docker-compose.prod.yml --profile with-nginx up -d
#
# 5. 查看状态：
#    docker-compose -f docker-compose.prod.yml ps
#    docker-compose -f docker-compose.prod.yml logs -f
# ============================================
